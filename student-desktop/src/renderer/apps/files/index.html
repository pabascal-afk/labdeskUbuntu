<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Trabajos - LabDesk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .header {
            background: #1e293b;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .folder-path { font-size: 13px; font-weight: 600; color: #60a5fa; }
        .btn {
            background: #334155;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { background: #475569; }

        .file-grid {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            align-content: flex-start;
            overflow-y: auto;
        }

        .file-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .file-card:hover {
            background: #27354a;
            border-color: #3b82f6;
            transform: translateY(-2px);
        }
        .file-icon { font-size: 32px; }
        .file-name {
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            word-break: break-word;
            max-width: 100%;
        }
        .file-meta { font-size: 10px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="header">
        <span class="folder-path" style="display:flex; align-items:center; gap:6px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            ~/Documentos/LabDesk
        </span>
        <button class="btn" onclick="renderSampleFiles()" style="display:inline-flex; align-items:center; gap:5px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            Actualizar
        </button>
    </div>

    <div class="file-grid" id="file-grid">
        <!-- Render dinámico -->
    </div>

    <script>
        const sampleFiles = [
            { name: 'Investigacion_Ciencias.html', type: 'writer', size: '24 KB', date: 'Hoy, 10:15' },
            { name: 'Presupuesto_Laboratorio.csv', type: 'calc', size: '8 KB', date: 'Hoy, 11:30' },
            { name: 'Presentacion_Grupo.json', type: 'slides', size: '14 KB', date: 'Ayer' }
        ];

        document.addEventListener('DOMContentLoaded', renderSampleFiles);

        function renderSampleFiles() {
            const grid = document.getElementById('file-grid');
            grid.innerHTML = '';

            sampleFiles.forEach(f => {
                const card = document.createElement('div');
                card.className = 'file-card';
                
                let iconSvg = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>';
                if (f.type === 'writer') {
                    iconSvg = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>';
                } else if (f.type === 'calc') {
                    iconSvg = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>';
                } else if (f.type === 'slides') {
                    iconSvg = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line><polygon points="10 7 15 10 10 13 10 7" fill="#f59e0b"></polygon></svg>';
                }

                card.innerHTML = `
                    <div class="file-icon">${iconSvg}</div>
                    <div class="file-name">${f.name}</div>
                    <div class="file-meta">${f.size} | ${f.date}</div>
                `;

                card.ondblclick = () => {
                    alert(`Abriendo ${f.name} en ${f.type.toUpperCase()}...`);
                };

                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
